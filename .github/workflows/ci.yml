name: CI - Sistema de Ponto

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar ambiente (debug temporário)
        run: |
          which python
          python --version
          python -m pip list

      - name: Rodar testes
        run: |
          python -m pytest --cov=src --cov=web --cov-report=term
        env:
          PYTHONPATH: .
